name: CD - Deploy to EC2

on:
  push:
    branches: [main, feature/ec2-infra-deploy]

env:
  AWS_REGION: us-east-1 

jobs:
  wait-for-ci:
    runs-on: ubuntu-latest
    steps:
    - name: Wait for CI to complete
      run: |
        echo "Waiting for CI to complete..."
        sleep 120

  deploy:
    runs-on: ubuntu-latest
    needs: wait-for-ci
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup AWS
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Setup Terraform 
      uses: hashicorp/setup-terraform@v3

    - name: Install Ansible
      run: |
        sudo apt update
        sudo apt install -y ansible
        ansible --version
    
    - name: Get AWS Account ID 
      run: |
        MY_ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
        echo "MY_ACCOUNT=$MY_ACCOUNT" >> $GITHUB_ENV
     
    - name: Deploy infrastructure with Terraform
      run: |
        cd infrastructure
        terraform init
        terraform plan -var="account_id=$MY_ACCOUNT" -var="AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}" -var="AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}" -var="AWS_KEY_PAIR_NAME=${{ secrets.AWS_KEY_PAIR_NAME }}"
        terraform apply -auto-approve -var="account_id=$MY_ACCOUNT" -var="AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}" -var="AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}" -var="AWS_KEY_PAIR_NAME=${{ secrets.AWS_KEY_PAIR_NAME }}"
        
        EC2_IP=$(terraform output -raw instance_public_ip)
        echo "EC2_IP=$EC2_IP" >> $GITHUB_ENV
        echo "EC2 Instance IP: $EC2_IP"
        
        echo "Waiting for EC2 instance to be ready..."
        sleep 180
        
        echo "Testing SSH connectivity..."
        timeout 60 bash -c "until nc -z $EC2_IP 22; do sleep 5; done"
        echo "Port 22 is now open"

    - name: Setup SSH
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" | tr -d '\r' > ~/.ssh/key
        chmod 600 ~/.ssh/key
        
        cat > ~/.ssh/config << EOF
        Host *
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            ConnectTimeout 30
        EOF
        chmod 600 ~/.ssh/config

    - name: Configure EC2 with Ansible
      run: |
        # Create Ansible inventory
        cat > inventory.ini << EOF
        [webservers]
        $EC2_IP ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/key
        EOF
        
        # Create Ansible playbook
        cat > configure-ec2.yml << 'EOF'
        ---
        - hosts: webservers
          become: yes
          tasks:
            - name: Update apt cache
              apt:
                update_cache: yes
                
            - name: Install required packages
              apt:
                name:
                  - docker.io
                  - docker-compose
                  - awscli
                  - curl
                  - wget
                state: present
                
            - name: Start and enable Docker
              service:
                name: docker
                state: started
                enabled: yes
                
            - name: Add ubuntu user to docker group
              user:
                name: ubuntu
                groups: docker
                append: yes
                
            - name: Create app directory
              file:
                path: /home/ubuntu/app
                state: directory
                owner: ubuntu
                group: ubuntu
                mode: '0755'
                
            - name: Configure AWS CLI region
              lineinfile:
                path: /home/ubuntu/.aws/config
                line: 'region = us-east-1'
                create: yes
                owner: ubuntu
                group: ubuntu
        EOF
        
        # Run Ansible playbook
        echo "Configuring EC2 instance with Ansible..."
        ansible-playbook -i inventory.ini configure-ec2.yml

    - name: Deploy App to EC2
      run: |
        # Create docker-compose file
        cat > docker-compose.yml << EOF
        version: '3.8'
        services:
          backend:
            image: $MY_ACCOUNT.dkr.ecr.us-east-1.amazonaws.com/my-backend:latest
            ports:
              - "5000:5000"
            environment:
              - MONGODB_URI=mongodb://mongodb:27017/todoapp
            depends_on:
              - mongodb

          frontend:
            image: $MY_ACCOUNT.dkr.ecr.us-east-1.amazonaws.com/my-frontend:latest
            ports:
              - "3000:3000"

          mongodb:
            image: mongo:5.0
            environment:
              MONGODB_INITDB_ROOT_USERNAME: admin
              MONGODB_INITDB_ROOT_PASSWORD: password
            volumes:
              - mongo_data:/data/db

        volumes:
          mongo_data:
        EOF
        
        # Copy docker-compose to EC2
        scp -i ~/.ssh/key -o StrictHostKeyChecking=no docker-compose.yml ubuntu@$EC2_IP:~/app/
        
        # Deploy using docker-compose
        ssh -i ~/.ssh/key -o StrictHostKeyChecking=no ubuntu@$EC2_IP << 'DEPLOY_EOF'
        cd ~/app
        
        # Login to ECR
        aws ecr get-login-password --region us-east-1 | sudo docker login --username AWS --password-stdin $MY_ACCOUNT.dkr.ecr.us-east-1.amazonaws.com
        
        # Deploy application
        sudo docker-compose down || true
        sudo docker-compose pull
        sudo docker-compose up -d
        
        echo "Application deployed successfully!"
        DEPLOY_EOF

    - name: Show URLs
      run: |
        echo "Deployment Complete!"
        echo "Frontend: http://$EC2_IP:3000"
        echo "Backend: http://$EC2_IP:5000"
        echo "MongoDB: Internal access only"