name: CD - Deploy to EC2

on:
  push:
    branches: [main, feature/ec2-infra-deploy]

env:
  AWS_REGION: us-east-1 

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup AWS
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Setup Terraform 
      uses: hashicorp/setup-terraform@v3

    - name: Install Ansible
      run: |
        sudo apt update
        sudo apt install -y ansible
    
    - name: Get AWS Account ID 
      run: |
        MY_ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
        echo "MY_ACCOUNT=$MY_ACCOUNT" >> $GITHUB_ENV
     
    - name: Deploy infrastructure with Terraform
      run: |
        cd infrastructure
        terraform init
        terraform apply -auto-approve -var="account_id=$MY_ACCOUNT" -var="AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}" -var="AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}" -var="AWS_KEY_PAIR_NAME=${{ secrets.AWS_KEY_PAIR_NAME }}"
        
        EC2_IP=$(terraform output -raw instance_public_ip)
        echo "EC2_IP=$EC2_IP" >> $GITHUB_ENV
        echo "EC2 Instance IP: $EC2_IP"
        
        echo "Waiting for EC2 instance to be ready..."
        sleep 120

    - name: Setup SSH
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" | tr -d '\r' > ~/.ssh/key
        chmod 600 ~/.ssh/key

    - name: Configure EC2 with Ansible
      run: |
        # Create Ansible inventory
        cat > inventory.ini << EOF
        [webservers]
        $EC2_IP ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/key ansible_ssh_common_args='-o StrictHostKeyChecking=no'
        EOF
        
        # Create Ansible config
        cat > ansible.cfg << EOF
        [defaults]
        host_key_checking = False
        timeout = 30
        EOF
        
        # Create simple Ansible playbook (Docker already installed via user_data)
        cat > configure-ec2.yml << 'EOF'
        ---
        - hosts: webservers
          become: yes
          tasks:
            - name: Wait for system to be ready
              wait_for_connection:
                timeout: 300
                
            - name: Ensure Docker is running
              service:
                name: docker
                state: started
                enabled: yes
                
            - name: Ensure app directory exists
              file:
                path: /home/ubuntu/app
                state: directory
                owner: ubuntu
                group: ubuntu
                mode: '0755'
                
            - name: Create AWS config directory
              file:
                path: /home/ubuntu/.aws
                state: directory
                owner: ubuntu
                group: ubuntu
                
            - name: Configure AWS CLI region
              copy:
                content: |
                  [default]
                  region = us-east-1
                dest: /home/ubuntu/.aws/config
                owner: ubuntu
                group: ubuntu
        EOF
        
        # Run Ansible playbook
        echo "Configuring EC2 instance with Ansible..."
        ansible-playbook -i inventory.ini configure-ec2.yml

    - name: Deploy App to EC2
      run: |
        # Create docker-compose file
        cat > docker-compose.yml << EOF
        version: '3.8'
        services:
          backend:
            image: $MY_ACCOUNT.dkr.ecr.us-east-1.amazonaws.com/my-backend:latest
            ports:
              - "5000:5000"
            environment:
              - MONGODB_URI=mongodb://mongodb:27017/todoapp
            depends_on:
              - mongodb

          frontend:
            image: $MY_ACCOUNT.dkr.ecr.us-east-1.amazonaws.com/my-frontend:latest
            ports:
              - "3000:3000"

          mongodb:
            image: mongo:5.0
            environment:
              MONGODB_INITDB_ROOT_USERNAME: admin
              MONGODB_INITDB_ROOT_PASSWORD: password
            volumes:
              - mongo_data:/data/db

        volumes:
          mongo_data:
        EOF
        
        # Deploy to EC2
        scp -i ~/.ssh/key -o StrictHostKeyChecking=no docker-compose.yml ubuntu@$EC2_IP:~/app/
        
        ssh -i ~/.ssh/key -o StrictHostKeyChecking=no ubuntu@$EC2_IP << 'EOF'
        cd ~/app
        
        # Login to ECR (may fail without IAM role, but continue)
        aws ecr get-login-password --region us-east-1 | sudo docker login --username AWS --password-stdin $MY_ACCOUNT.dkr.ecr.us-east-1.amazonaws.com || echo "ECR login failed - continuing anyway"
        
        # Deploy application
        sudo docker-compose down || true
        sudo docker-compose up -d
        
        echo "Application deployed successfully!"
        EOF

    - name: Show URLs
      run: |
        echo "Deployment Complete!"
        echo "Frontend: http://$EC2_IP:3000"
        echo "Backend: http://$EC2_IP:5000"