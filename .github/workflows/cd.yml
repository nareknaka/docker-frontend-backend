name: CD - Deploy to EC2

on:
  workflow_run:
    workflows: ["CI Build and push Image"]  
    types: [completed]
    branches: [feature/ec2-infra-deploy, main]


env:
  AWS_REGION: us-east-1 

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
    - name: Chechout
      uses: actions/checkout@v4

    - name: Setup AWS
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID}}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY}}
        aws-region: us-east-1

    - name: Setup Terraform 
      uses: hashicorp/setup-terraform@v3
    
    - name: Get AWS Acount ID 
      run: |
        MY_ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
        echo "MY_ACCOUNT=$MY_ACCOUNT" >> $GITHUB_ENV
    
    - name: Deploy infrastructure with Terraform
      run: |
        cd infrastructure
        terraform init
        terraform plan -var="account_id=$MY_ACCOUNT"
        terraform apply -auto-approve -var="account_id=$MY_ACCOUNT"
        
        # Get EC2 instance IP and wait for it to be ready
        EC2_IP=$(terraform output -raw instance_public_ip)
        echo "EC2_IP=$EC2_IP" >> $GITHUB_ENV
        echo "Waiting for EC2 instance to be ready..."
        sleep 60 
      
