name: CD - Deploy to EC2

on:
  push:
    branches: [main, feature/ec2-infra-deploy]

env:
  AWS_REGION: us-east-1 

jobs:
  wait-for-ci:
    runs-on: ubuntu-latest
    steps:
    - name: Wait for CI to complete
      run: |
        echo "Waiting for CI to complete..."
        sleep 120  # Wait 2 minutes for CI

  deploy:
    runs-on: ubuntu-latest
    needs: wait-for-ci
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup AWS
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Setup Terraform 
      uses: hashicorp/setup-terraform@v3
    
    - name: Get AWS Account ID 
      run: |
        MY_ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
        echo "MY_ACCOUNT=$MY_ACCOUNT" >> $GITHUB_ENV
    
    - name: Clean up existing resources (if needed)
      run: |
        cd infrastructure
        terraform init
        terraform destroy -auto-approve -var="account_id=$MY_ACCOUNT" -var="AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}" -var="AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}" -var="AWS_KEY_PAIR_NAME=${{ secrets.AWS_KEY_PAIR_NAME }}" || true
      continue-on-error: true

    - name: Deploy infrastructure with Terraform
      run: |
        cd infrastructure
        terraform init
        terraform plan -var="account_id=$MY_ACCOUNT" -var="AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}" -var="AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}" -var="AWS_KEY_PAIR_NAME=${{ secrets.AWS_KEY_PAIR_NAME }}"
        terraform apply -auto-approve -var="account_id=$MY_ACCOUNT" -var="AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}" -var="AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}" -var="AWS_KEY_PAIR_NAME=${{ secrets.AWS_KEY_PAIR_NAME }}"
        
        # Get EC2 instance IP and wait for it to be ready
        EC2_IP=$(terraform output -raw instance_public_ip)
        echo "EC2_IP=$EC2_IP" >> $GITHUB_ENV
        echo "EC2 Instance IP: $EC2_IP"
        
        # Wait for EC2 to fully initialize
        echo "Waiting for EC2 instance to be ready..."
        sleep 180
        
        # Check if EC2 is responding to SSH
        echo "Testing SSH connectivity..."
        timeout 60 bash -c "until nc -z $EC2_IP 22; do sleep 5; done"
        echo "Port 22 is now open"

    - name: Setup SSH
      run: |
        mkdir -p ~/.ssh
        
        # Fix SSH key format
        echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/key
        chmod 600 ~/.ssh/key
        
        # Add SSH config
        cat > ~/.ssh/config << EOF
        Host *
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            ConnectTimeout 30
        EOF
        
        chmod 600 ~/.ssh/config
        
        # Test SSH connectivity
        echo "Testing SSH connection..."
        ssh -i ~/.ssh/key ubuntu@$EC2_IP "echo 'SSH test successful'"

    - name: Deploy App to EC2
      run: |
        # Create deploy script
        cat > deploy.sh << 'EOF'
        #!/bin/bash
        set -e
        
        echo "Starting deployment script..."
        
        # Install Docker if needed
        if ! command -v docker &> /dev/null; then
          echo "Installing Docker..."
          sudo apt update
          sudo apt install -y docker.io docker-compose awscli
          sudo systemctl start docker
          sudo usermod -aG docker ubuntu
          echo "Docker installed successfully"
        else
          echo "Docker already installed"
        fi

        # Login to ECR
        echo "Logging into ECR..."
        aws ecr get-login-password --region us-east-1 | sudo docker login --username AWS --password-stdin $1.dkr.ecr.us-east-1.amazonaws.com
        
        # Stop old containers
        echo "Stopping old containers..."
        sudo docker-compose down 2>/dev/null || true
        
        # Create docker-compose
        echo "Creating docker-compose.yml..."
        cat > docker-compose.yml << COMPOSE_EOF
        version: '3.8'
        services:
          backend:
            image: $1.dkr.ecr.us-east-1.amazonaws.com/my-backend:latest
            ports:
              - "5000:5000"
            environment:
              - MONGODB_URI=mongodb://mongodb:27017/todoapp
            depends_on:
              - mongodb
 
          frontend:
            image: $1.dkr.ecr.us-east-1.amazonaws.com/my-frontend:latest
            ports:
              - "3000:3000"
 
          mongodb:
            image: mongo:5.0
            environment:
              MONGODB_INITDB_ROOT_USERNAME: admin
              MONGODB_INITDB_ROOT_PASSWORD: password
            volumes:
              - mongo_data:/data/db
 
        volumes:
          mongo_data:
        COMPOSE_EOF
        
        # Start app
        echo "Starting application..."
        sudo docker-compose pull
        sudo docker-compose up -d
        
        echo "App deployed successfully!"
        EOF
        
        # Copy and execute script
        echo "Copying deployment script to EC2..."
        scp -i ~/.ssh/key -o StrictHostKeyChecking=no deploy.sh ubuntu@$EC2_IP:~/
        
        echo "Executing deployment script on EC2..."
        ssh -i ~/.ssh/key -o StrictHostKeyChecking=no ubuntu@$EC2_IP "chmod +x deploy.sh && ./deploy.sh $MY_ACCOUNT"

    - name: Show URLs
      run: |
        echo " Deployment Complete!"
        echo "Frontend: http://$EC2_IP:3000"
        echo "Backend: http://$EC2_IP:5000"