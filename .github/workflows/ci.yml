name: CI Build and push Image

on:
  push:
    branches: [main, feature/ec2-infra-deploy]

env:
  AWS_REGION: us-east-1

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup AWS
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Get AWS Account ID
      run: |
        MY_ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
        echo "MY_ACCOUNT=$MY_ACCOUNT" >> $GITHUB_ENV

    - name: Create ECR repositories
      run: |
        aws ecr create-repository --repository-name my-frontend || true
        aws ecr create-repository --repository-name my-backend || true

    - name: Login to ECR
      run: |
        aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin $MY_ACCOUNT.dkr.ecr.us-east-1.amazonaws.com

    - name: Build Docker Images
      run: |
        echo "Building frontend image..."
        docker build -t my-frontend:latest ./frontend
        
        echo "Building backend image..."
        docker build -t my-backend:latest ./backend

    - name: Install Trivy
      run: |
        sudo apt-get update
        sudo apt-get install wget apt-transport-https gnupg lsb-release -y
        wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
        echo "deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee -a /etc/apt/sources.list.d/trivy.list
        sudo apt-get update
        sudo apt-get install trivy -y

    - name: Scan Docker Images with Trivy
      run: |
        echo "Scanning frontend image..."
        trivy image --exit-code 0 --format table my-frontend:latest
        
        echo "Scanning backend image..."  
        trivy image --exit-code 0 --format table my-backend:latest
        
        echo "Generating detailed reports..."
        trivy image --format json --output frontend-scan.json my-frontend:latest
        trivy image --format json --output backend-scan.json my-backend:latest
      continue-on-error: true

    - name: Upload Trivy Scan Results
      uses: actions/upload-artifact@v4
      with:
        name: trivy-scan-results
        path: |
          frontend-scan.json
          backend-scan.json

    - name: Tag and Push Images to ECR
      run: |
        echo "Tagging and pushing frontend..."
        docker tag my-frontend:latest $MY_ACCOUNT.dkr.ecr.us-east-1.amazonaws.com/my-frontend:latest
        docker push $MY_ACCOUNT.dkr.ecr.us-east-1.amazonaws.com/my-frontend:latest
        
        echo "Tagging and pushing backend..."
        docker tag my-backend:latest $MY_ACCOUNT.dkr.ecr.us-east-1.amazonaws.com/my-backend:latest
        docker push $MY_ACCOUNT.dkr.ecr.us-east-1.amazonaws.com/my-backend:latest

    - name: Build Summary
      run: |
        echo "Build and Push Complete!"
        echo "Frontend image: $MY_ACCOUNT.dkr.ecr.us-east-1.amazonaws.com/my-frontend:latest"
        echo "Backend image: $MY_ACCOUNT.dkr.ecr.us-east-1.amazonaws.com/my-backend:latest"
        echo "Security scans completed with Trivy"