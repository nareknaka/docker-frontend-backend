name: Cleanup - Destroy AWS Resources

on:
  workflow_dispatch:  # Manual trigger only

env:
  AWS_REGION: us-east-1

jobs:
  cleanup:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup AWS
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
    
    - name: Get AWS Account ID
      run: |
        MY_ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
        echo "MY_ACCOUNT=$MY_ACCOUNT" >> $GITHUB_ENV
        echo "Starting cleanup for account: $MY_ACCOUNT"

    - name: Force Delete ALL EC2 Instances
      run: |
        echo "Finding and terminating ALL EC2 instances..."
        
        # Get all running instance IDs
        INSTANCE_IDS=$(aws ec2 describe-instances \
          --filters "Name=instance-state-name,Values=running,pending,stopping,stopped" \
          --query 'Reservations[*].Instances[*].InstanceId' \
          --output text)
        
        if [ -n "$INSTANCE_IDS" ]; then
          echo "Found instances: $INSTANCE_IDS"
          echo "Terminating all instances..."
          aws ec2 terminate-instances --instance-ids $INSTANCE_IDS
          
          # Wait for termination
          echo "Waiting for instances to terminate..."
          aws ec2 wait instance-terminated --instance-ids $INSTANCE_IDS
          echo "All instances terminated"
        else
          echo "No instances found to terminate"
        fi
      continue-on-error: true

    - name: Destroy Terraform Infrastructure
      run: |
        cd infrastructure
        terraform init
        echo "Destroying Terraform-managed resources..."
        terraform destroy -auto-approve -var="account_id=$MY_ACCOUNT" -var="AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}" -var="AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}" -var="AWS_KEY_PAIR_NAME=${{ secrets.AWS_KEY_PAIR_NAME }}" || true
      continue-on-error: true

    - name: Clean up Security Groups
      run: |
        echo "Cleaning up security groups..."
        
        # Delete webapp security group
        SG_ID=$(aws ec2 describe-security-groups \
          --filters "Name=group-name,Values=webapp-security-group" \
          --query 'SecurityGroups[0].GroupId' \
          --output text)
        
        if [ "$SG_ID" != "None" ] && [ "$SG_ID" != "" ]; then
          echo "Deleting security group: $SG_ID"
          aws ec2 delete-security-group --group-id $SG_ID || echo "Security group deletion failed (might be in use)"
        fi
      continue-on-error: true

    - name: Clean up ECR Repositories
      run: |
        echo "Cleaning up ECR repositories..."
        
        # Delete all images and repositories
        for repo in my-frontend my-backend; do
          echo "Cleaning repository: $repo"
          aws ecr describe-images --repository-name $repo --query 'imageDetails[*].imageDigest' --output text | \
          xargs -I {} aws ecr batch-delete-image --repository-name $repo --image-ids imageDigest={} || true
          
          aws ecr delete-repository --repository-name $repo --force || true
        done
        
        echo "ECR repositories cleaned up"
      continue-on-error: true

    - name: Final Resource Check
      run: |
        echo "Final resource check..."
        
        echo "Remaining EC2 Instances:"
        aws ec2 describe-instances --filters "Name=instance-state-name,Values=running,pending,stopping,stopped" --query 'Reservations[*].Instances[*].[InstanceId,State.Name]' --output table || true
        
        echo "Remaining Security Groups:"
        aws ec2 describe-security-groups --query 'SecurityGroups[?GroupName!=`default`].[GroupId,GroupName]' --output table || true

    - name: Cleanup Summary
      run: |
        echo "Aggressive cleanup completed!"
        echo "All EC2 instances terminated"
        echo "Security groups cleaned"
        echo "ECR repositories cleaned"
        echo "Your AWS bill should now be minimal!"