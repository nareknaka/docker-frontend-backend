# GitHub Workflow - YAML GitHub Workflow (github-workflow.json)

name: Deploy Docker App to EC2

on:
  push:
    branches:
      - main
      - ngrigoryan/learning

env:
  AWS_REGION: us-east-1
  ECR_REPO_FRONTEND: 650251694526.dkr.ecr.us-east-1.amazonaws.com/webapp/frontend
  ECR_REPO_BACKEND: 650251694526.dkr.ecr.us-east-1.amazonaws.com/webapp/backend
  DOCKER_BUILDKIT: 1

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build frontend Docker image
        run: docker build -t $ECR_REPO_FRONTEND:latest ./frontend

      - name: Build backend Docker image
        run: docker build -t $ECR_REPO_BACKEND:latest ./backend

      - name: Login to frontend ECR
        run: |
          aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REPO_FRONTEND

      - name: Push frontend to ECR
        run: docker push $ECR_REPO_FRONTEND:latest

      - name: Login to backend ECR
        run: |
          aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REPO_BACKEND

      - name: Push backend to ECR
        run: docker push $ECR_REPO_BACKEND:latest

      - name: Save SSH Key to file
        run: echo "${{ secrets.EC2_SSH_KEY }}" > key.pem && chmod 600 key.pem

      - name: Deploy to EC2 via SSH and Docker Compose
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo apt update && sudo apt install -y git curl

            # install docker-compose manually
            sudo curl -L "https://github.com/docker/compose/releases/download/v2.27.1/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
            sudo chmod +x /usr/local/bin/docker-compose

            git clone https://github.com/nareknaka/docker-frontend-backend.git || true
            cd docker-frontend-backend

            aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REPO_FRONTEND
            aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REPO_BACKEND

            docker pull $ECR_REPO_FRONTEND:latest
            docker pull $ECR_REPO_BACKEND:latest

            docker-compose down || true
            docker-compose up -d
