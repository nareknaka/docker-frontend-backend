name: Build, Scan, and Push to ECR

on:
  push:
    branches: [ngrigoryan/learning]

env:
  AWS_REGION: us-east-1
  ECR_REPO_FRONTEND: 650252169452.dkr.ecr.us-east-1.amazonaws.com/frontend
  ECR_REPO_BACKEND:  650252169452.dkr.ecr.us-east-1.amazonaws.com/backend

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      uses: aws-actions/amazon-ecr-login@v1

    - name: Build frontend Docker image
      run: docker build -t $ECR_REPO_FRONTEND ./frontend

    - name: Scan frontend with Trivy
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ env.ECR_REPO_FRONTEND }}

    - name: Push frontend to ECR
      run: docker push $ECR_REPO_FRONTEND

    - name: Build backend Docker image
      run: docker build -t $ECR_REPO_BACKEND ./backend

    - name: Scan backend with Trivy
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ env.ECR_REPO_BACKEND }}

    - name: Push backend to ECR
      run: docker push $ECR_REPO_BACKEND
