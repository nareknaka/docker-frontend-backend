name: Deploy Docker Web App to EC2

on:
  push:
    branches:
      - main
      - ngrigoryan/learning 

env:
  REGION: us-east-1
  ECR_REPO_FRONTEND: 123456789012.dkr.ecr.us-east-1.amazonaws.com/frontend
  ECR_REPO_BACKEND: 123456789012.dkr.ecr.us-east-1.amazonaws.com/backend

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.REGION }}

      - name: Build frontend image
        run: docker build -t $ECR_REPO_FRONTEND:latest ./frontend

      - name: Build backend image
        run: docker build -t $ECR_REPO_BACKEND:latest ./backend

      - name: ECR login for frontend
        run: |
          aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $ECR_REPO_FRONTEND

      - name: Push frontend image
        run: docker push $ECR_REPO_FRONTEND:latest

      - name: ECR login for backend
        run: |
          aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $ECR_REPO_BACKEND

      - name: Push backend image
        run: docker push $ECR_REPO_BACKEND:latest

      - name: Save SSH Key to file
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" > key.pem
          chmod 400 key.pem

      - name: Deploy to EC2 via SSH and Docker Compose
        run: |
          ssh -o StrictHostKeyChecking=no -i key.pem ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            sudo apt update && sudo apt install -y git curl
            curl -L "https://github.com/docker/compose/releases/download/1.29.2/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
            chmod +x /usr/local/bin/docker-compose
            git clone https://github.com/nareknaka/docker-frontend-backend.git || true
            cd docker-frontend-backend
            aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $ECR_REPO_FRONTEND
            aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $ECR_REPO_BACKEND
            docker pull $ECR_REPO_FRONTEND:latest
            docker pull $ECR_REPO_BACKEND:latest
            docker-compose down || true
            docker-compose up -d
          EOF
