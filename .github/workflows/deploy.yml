name: Deploy Docker Web App to EC2

on:
  push:
    branches:
      - main

env:
  REGION: us-east-1
  ECR_REPO_FRONTEND: 123456789012.dkr.ecr.us-east-1.amazonaws.com/frontend
  ECR_REPO_BACKEND: 123456789012.dkr.ecr.us-east-1.amazonaws.com/backend

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.REGION }}

      - name: Build frontend image
        run: docker build -t $ECR_REPO_FRONTEND:latest ./frontend

      - name: Build backend image
        run: docker build -t $ECR_REPO_BACKEND:latest ./backend

      - name: ECR login (frontend)
        run: aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $ECR_REPO_FRONTEND

      - name: Push frontend image
        run: docker push $ECR_REPO_FRONTEND:latest

      - name: ECR login (backend)
        run: aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $ECR_REPO_BACKEND

      - name: Push backend image
        run: docker push $ECR_REPO_BACKEND:latest

      - name: Deploy to EC2 via SSH and Docker Compose
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd docker-frontend-backend
            git pull origin main
            docker-compose pull
            docker-compose down
            docker-compose up -d
